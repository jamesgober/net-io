# =============================================================================
#  R E P S   ·   net-io
# =============================================================================
[package]
name    = "net-io"
version = "0.2.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Network IO substrate for Rust: TCP, UDP and local-socket listeners, connection lifecycle, limits, graceful drain, PROXY protocol, and a TLS seam. Protocol-free and dependency-free."

# Keywords (5 max)
keywords = ["network", "tcp", "udp", "server", "socket"]

# Categories
categories = ["network-programming"]

# Links
homepage      = "https://github.com/jamesgober/net-io"
repository    = "https://github.com/jamesgober/net-io"
documentation = "https://docs.rs/net-io"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "net_io"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = []


# DEPENDENCIES
# #################################
[dependencies]
# None. Sockets, socket options, the drivers, and the PROXY protocol parser
# are all in this crate. TLS plugs in through a trait from a separate crate.


# DEV DEPENDENCIES
# #################################
[dev-dependencies]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
